name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sop-platform/backend/requirements.txt
      - name: Run backend tests
        env:
          PYTHONPATH: sop-platform/backend
        run: |
          python -m pytest -q sop-platform/backend/tests

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    if: "exists('sop-platform/frontend/package.json')"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend dependencies
        working-directory: sop-platform/frontend
        run: npm ci
      - name: Build frontend
        working-directory: sop-platform/frontend
        run: npm run build
